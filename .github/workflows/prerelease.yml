name: Prerelease publication

on:
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description:
          Successful non-dry-run Release candidate qualification run for this
          exact tag SHA
        required: true
        type: string
      publish:
        description: Request the separately protected OIDC npm registry job
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.bundle.outputs.version }}
      artifact: ${{ steps.bundle.outputs.artifact }}
      sbom: ${{ steps.bundle.outputs.sbom }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch immutable qualification artifact and run metadata
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        run: |
          mkdir -p .artifacts/qualification-download .artifacts/sdlc
          test "$(printf '%s' "$QUALIFICATION_RUN_ID" | tr -d '0-9')" = ""
          gh run download "$QUALIFICATION_RUN_ID" --name "agent-relay-qualification-${GITHUB_SHA}" --dir .artifacts/qualification-download
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN_ID}" > .artifacts/sdlc/qualification-run.json
          cp -R .artifacts/qualification-download/.artifacts/release .artifacts/release
          cp -R .artifacts/qualification-download/.artifacts/release-evidence .artifacts/release-evidence
          cp -R .artifacts/qualification-download/.artifacts/release-exit .artifacts/release-exit
          cp .artifacts/qualification-download/.artifacts/sdlc/qualification.json .artifacts/sdlc/qualification.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify evidence SHA, workflow, inputs, run, and artifact digests
        run: |
          test "$(git rev-parse refs/remotes/origin/main^{commit})" = "$GITHUB_SHA"
          node scripts/sdlc/qualification.mjs verify --candidate "$GITHUB_SHA" \
            --evidence .artifacts/sdlc/qualification.json \
            --run-metadata .artifacts/sdlc/qualification-run.json
      - name: Verify the pre-tag candidate bundle without rebuilding it
        id: bundle
        run:
          node scripts/verify-release-bundle.mjs .artifacts/release
          --allow-tag-promotion
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: agent-relay-${{ steps.bundle.outputs.version }}
          path: .artifacts/release/
          if-no-files-found: error
          retention-days: 14

  attest:
    needs: evidence
    if:
      github.event.repository.visibility == 'public' ||
      vars.AGENT_RELAY_PRIVATE_ATTESTATIONS == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: agent-relay-${{ needs.evidence.outputs.version }}
          path: .artifacts/release/
      - name: Attest qualified build provenance
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: ${{ needs.evidence.outputs.artifact }}
      - name: Attest the qualified artifact SBOM
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: ${{ needs.evidence.outputs.artifact }}
          sbom-path: ${{ needs.evidence.outputs.sbom }}

  publish:
    needs: [evidence, attest]
    if: inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-prerelease
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: agent-relay-${{ needs.evidence.outputs.version }}
          path: .artifacts/release/
      - name: Enforce code, tag, visibility, environment, OIDC, and bundle gates
        env:
          AGENT_RELAY_PUBLISH_INPUT: ${{ inputs.publish }}
          AGENT_RELAY_REPOSITORY_VISIBILITY:
            ${{ github.event.repository.visibility }}
          AGENT_RELAY_RELEASE_WORKFLOW: prerelease.yml
          AGENT_RELAY_RELEASE_ENVIRONMENT: npm-prerelease
          AGENT_RELAY_TRUSTED_PUBLISHER_CONFIGURED:
            ${{ vars.AGENT_RELAY_TRUSTED_PUBLISHER_CONFIGURED }}
        run: node scripts/publish-release.mjs .artifacts/release --execute
