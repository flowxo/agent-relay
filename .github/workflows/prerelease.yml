name: Prerelease

on:
  push:
    tags:
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      publish:
        description:
          Request the separately protected npm registry job. The checked-in
          owner approval still defaults to false.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.bundle.outputs.version }}
      artifact: ${{ steps.bundle.outputs.artifact }}
      sbom: ${{ steps.bundle.outputs.sbom }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm contracts:preinstall
      - run: pnpm rebuild
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit --prod
      - name: Build two identical release artifacts, checksums, and SPDX SBOM
        id: bundle
        run: node scripts/build-release.mjs --expected-tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: agent-relay-${{ steps.bundle.outputs.version }}
          path: .artifacts/release/
          if-no-files-found: error
          retention-days: 14

  attest:
    needs: build
    if:
      github.event.repository.visibility == 'public' ||
      vars.AGENT_RELAY_PRIVATE_ATTESTATIONS == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: agent-relay-${{ needs.build.outputs.version }}
          path: .artifacts/release/
      - name: Attest build provenance
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: ${{ needs.build.outputs.artifact }}
      - name: Attest the artifact SBOM
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: ${{ needs.build.outputs.artifact }}
          sbom-path: ${{ needs.build.outputs.sbom }}

  publish:
    needs: [build, attest]
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-prerelease
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: agent-relay-${{ needs.build.outputs.version }}
          path: .artifacts/release/
      - name: Enforce code, tag, visibility, environment, OIDC, and bundle gates
        env:
          AGENT_RELAY_PUBLISH_INPUT: ${{ inputs.publish }}
          AGENT_RELAY_REPOSITORY_VISIBILITY:
            ${{ github.event.repository.visibility }}
          AGENT_RELAY_RELEASE_WORKFLOW: prerelease.yml
          AGENT_RELAY_RELEASE_ENVIRONMENT: npm-prerelease
        run: node scripts/publish-release.mjs .artifacts/release --execute
