name: Documentation improvement
description: Correct or improve public product, setup, or contributor guidance.
title: "[Docs]: "
body:
  - type: markdown
    attributes:
      value: |
        Never paste tokens, `.env` files, SQLite or other private databases, raw logs/configs, hook payloads, transcripts, account/session identifiers, usernames, hostnames, repository identities, or machine-specific paths. Use synthetic examples. Report vulnerabilities privately through the Security contact link.
  - type: input
    id: page
    attributes:
      label: Page or section
      placeholder: docs/telegram.md — Troubleshooting
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current problem
      description:
        Explain what is missing, incorrect, ambiguous, or out of date.
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed outcome
      description: Describe the wording or user journey that should change.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Primary evidence
      description:
        Link current official documentation or name a credential-free local
        check.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label:
            All examples and paths are synthetic and contain no credentials,
            private databases, logs/configs, payloads, transcripts, identities,
            or machine-specific paths.
          required: true
        - label: This is not a vulnerability or sensitive security report.
          required: true
